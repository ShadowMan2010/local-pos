<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer display</title>
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem('m3pos.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="css/m3.css">
  <style>
    body { cursor: none; overflow: hidden; }
    #stage { display: grid; place-items: center; height: 100vh; padding: 24px; text-align: center; }
    .d-wrap { display: grid; justify-items: center; gap: 12px; }
    .d-amount { font: 500 clamp(48px, 12vw, 96px)/1.05 var(--md-font); color: var(--md-primary); }
    .d-qr { padding: 16px; border-radius: var(--md-shape-xl); background: #fff; }
    .d-qr img { display: block; width: min(52vh, 70vw); height: auto; image-rendering: pixelated; }
    /* The waiting state holds the exact box the QR will occupy, so the screen does not jump when it lands.
       Sized from the same `min(52vh, 70vw)` the image uses, and square because a UPI QR is square — a
       placeholder of the wrong shape would move the line of text below it on the one transition a customer
       is watching. */
    .d-qr-wait { width: min(52vh, 70vw); aspect-ratio: 1; display: grid; place-items: center; }
    .d-spinner { width: 44px; height: 44px; border-width: 4px; }
    .d-icon { font-size: 96px; color: var(--md-primary); }
    .d-icon.material-symbols-rounded { font-size: 96px; }
    /* The customer's name from the bill. Sized below the store name so it reads as belonging to the sale
       rather than to the shop, and clamped to one line: a long name must not push the amount or the QR
       off a fixed panel. */
    .d-name { font: 500 clamp(20px, 4.5vw, 34px)/1.2 var(--md-font); color: var(--md-on-surface); }
    /* Lost-the-till mark. Sits at the bottom over the current frame rather than replacing it, so a network
       blip mid-queue still leaves the amount on screen. */
    .d-net {
      position: fixed; inset: auto 0 0 0; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 12px 20px; font: 500 16px/1 var(--md-font); color: var(--md-on-surface);
      background: var(--md-surface-container-high); border-top: 1px solid var(--md-outline-variant);
    }
    .d-net .progress { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <main id="stage"></main>
  <script src="/vendor/qrcode.min.js"></script>
  <script type="module" src="js/display.js"></script>
</body>
</html>
