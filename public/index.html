<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LOCAL POS</title>
  <script>
    // set theme before first paint (no flash)
    document.documentElement.dataset.theme =
      localStorage.getItem('m3pos.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="preload" href="fonts/bodoni-moda-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/m3.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <!-- The boot screen. Written into the HTML rather than built by JavaScript, which is the only way it
       can do its job: the modules below take a moment to arrive, and a splash created by script appears
       after the blank white page it was supposed to cover. Here it is part of the first paint.
       The script under it is a deadline rather than a dismissal, because a splash with no way off it is a
       till that looks frozen. -->
  <div id="boot" role="status">
    <div class="boot-inner">
      <div class="boot-plate">
        <span class="boot-shine boot-logo-shine">
          <img class="boot-logo" src="logo.png" alt="" width="104" height="111">
        </span>
      </div>
      <div class="boot-name">LOCAL POS</div>
      <div class="boot-by">
        <span class="boot-tagline">Built for Bharat by</span>
        <span class="boot-shine boot-edupulse-shine">
          <img class="boot-edupulse" src="edupulse-logo.png" alt="EduPulse" width="168" height="27">
        </span>
      </div>
    </div>
  </div>
  <script>
    // The safety net, inline and immediate so it does not wait for a module that may never load.
    // The splash is removed by js/main.js as soon as the first real screen is on its way in, but that is
    // a request to a server with no timeout on it: on a shop's flaky connection a fetch can sit open for
    // minutes, and this shop's till would be showing a logo instead of a dashboard the entire time. The
    // splash is a courtesy, so it is given a deadline of its own rather than inheriting one.
    setTimeout(function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    }, 7000);
  </script>

  <div id="app" aria-busy="true"></div>
  <div id="print-root" aria-hidden="true"></div>
  <div id="snackbar" role="status" aria-live="polite"></div>

  <!-- QR generator (only needed on the POS and the customer display) -->
  <script src="/vendor/qrcode.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
